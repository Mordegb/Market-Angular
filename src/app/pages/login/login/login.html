<div class="container">
  <div class="mobile-decorator"></div>
  <div class="login-card">
    <form class="formulario" [formGroup]="loginForm" (ngSubmit)="login()">
      <input type="text" class="email" placeholder="E-mail" formControlName="UserEmail" />
      <div class="campo-senha">
        <input
          [type]="inputType"
          class="senha"
          placeholder="Senha"
          formControlName="UserPassword"
        />
        <img
          [src]="inputType === 'password' ? 'darkEye.svg' : 'darkEyeOff.svg'"
          (click)="switchType()"
          alt="mostrar ou ocultar senha"
          class="toggle-senha"
        />
      </div>

      <button
        type="submit"
        [className]="loginForm.valid ? 'botao-true' : 'botao-false'"
        [disabled]="loginForm.invalid"
      >
        Login
      </button>
      <div class="conta-teste-container">
        <button class="conta-teste" type="button" (click)="useTestAccount()">usar conta de teste</button>
      </div>
    </form>

    <div class="divisoria"></div>

    <div class="imagem-lateral">
      <img src="logo.svg" alt="Market Polo" />
    </div>
  </div>

</div>
