@if (isLoading()) {
   <app-loading-animate color="#d0014d" ></app-loading-animate>
} @else {
  <ul class="container-produtos">
    @for (item of produtos(); track item.id) {
      <li class="card-produto">
        <a [routerLink]="['/product', item.id]" class="link-produto">
          <img [src]="item.thumbnail" [alt]="item.title" />
        </a>
        <h2>{{ item.title }}</h2>

        <div class="info">
          <p class="preco">Preço: R${{ item.price }}</p>
          <p class="estoque">Estoque: {{ getStock(item.id!) }} em estoque</p>

          <app-button-color [texto]="'Adicionar ao Carrinho'" (clicou)="comprar(item)">
          </app-button-color>
        </div>
      </li>
    }
  </ul>
}
